name: Publish verified Windows preview
on:
  push:
    branches: ['release-assets/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify existing single-file executable
        shell: bash
        run: |
          cat delivery/LiaoShen.exe.part-* > LiaoShen.exe
          sha256sum --check delivery/LiaoShen.exe.sha256
      - name: Upload executable and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload v1.0.0-preview LiaoShen.exe delivery/READ_ME_ZH.txt delivery/LiaoShen.exe.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v1.0.0-preview --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
