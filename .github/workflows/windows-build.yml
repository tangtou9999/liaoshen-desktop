name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -r requirements-windows.lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --clean --noconfirm LiaoShen.spec
      - uses: actions/upload-artifact@v4
        with:
          name: LiaoShen-Windows-x64
          path: dist/LiaoShen.exe
          if-no-files-found: error
